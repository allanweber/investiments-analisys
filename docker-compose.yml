services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investiments
    ports:
      # Use 5434 on the host if another Postgres already uses 5432 (e.g. another Docker project).
      - '5434:5432'
    volumes:
      - investiments_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d investiments']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/investiments
      HOST: 0.0.0.0
      PORT: '3000'
      RUN_QUOTE_WORKER: 'true'
      QUOTE_WORKER_HEALTH_PORT: '8081'
    env_file:
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(`http://127.0.0.1:8081/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  investiments_pg:
